<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Прототип iLab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@600;700;800&display=swap">
<style>
/* Слева оглавление по сценариям и подсказка к текущему экрану, справа телефон в натуральную величину */
:root{
  --bg:#E8EFF7;
  --panel:#FFFFFF;
  --ink:#16202B;
  --ink-2:#55657A;
  --line:#DAE3EE;
  --blue:#0066B3;
  --blue-soft:#E6F0FA;
  --on-blue:#FFFFFF;
  --yellow:#FFEA3D;
  --bezel:#0C1420;
  --bezel-edge:#2A3546;
  --shadow:rgba(16,44,92,.22);
  --show-light:inline-block;
  --show-dark:none;
  --f-display:'Rubik','Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-body:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09111D; --panel:#0F1A2A; --ink:#E6EDF6; --ink-2:#9AAAC0; --line:#1E2C42;
    --blue:#4CA2FF; --blue-soft:#14253C; --on-blue:#06121F; --yellow:#FFEA3D;
    --bezel:#000000; --bezel-edge:#3A485E; --shadow:rgba(0,0,0,.55);
    --show-light:none; --show-dark:inline-block; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09111D; --panel:#0F1A2A; --ink:#E6EDF6; --ink-2:#9AAAC0; --line:#1E2C42;
  --blue:#4CA2FF; --blue-soft:#14253C; --on-blue:#06121F; --yellow:#FFEA3D;
  --bezel:#000000; --bezel-edge:#3A485E; --shadow:rgba(0,0,0,.55);
  --show-light:none; --show-dark:inline-block; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
.lg-l{display:var(--show-light)}
.lg-d{display:var(--show-dark)}
.lg-l svg,.lg-d svg{display:block}
.app{box-sizing:border-box;height:100%;display:grid;grid-template-columns:344px minmax(0,1fr);gap:16px;
  padding-block:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.side{min-height:0;overflow:auto;overscroll-behavior:contain;background:var(--panel);border:1px solid var(--line);border-radius:22px;
  padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.intro h1{margin:0;font:700 22px/1.2 var(--f-display);letter-spacing:-.2px;text-wrap:balance}
.intro p{margin:6px 0 0;color:var(--ink-2);font-size:14px;line-height:1.45}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--blue-soft);gap:3px}
.seg button{flex:1;border:0;border-radius:9px;padding:8px 10px;background:transparent;color:var(--ink-2);font:600 14px/1 var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.now{border-radius:16px;background:var(--blue-soft);padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:11px;line-height:14px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--blue);font-variant-numeric:tabular-nums}
.now h2{margin:0;font:700 19px/1.25 var(--f-display);text-wrap:balance}
.now p{margin:0;font-size:14px;line-height:1.45;color:var(--ink-2)}
.now .warn{color:var(--ink);font-weight:600}
.row{display:flex;gap:8px;margin-top:6px}
.row button,.row a{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;
  font:600 14px/1 var(--f-body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.row #next{flex:1;background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.toc{display:flex;flex-direction:column;gap:14px}
.toc h3{margin:0 0 4px;font-size:11px;line-height:14px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink-2)}
.toc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.3}
.toc a:hover{background:var(--blue-soft)}
.toc a[aria-current="page"]{background:var(--blue);color:var(--on-blue);font-weight:600}
.toc .chip{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.6px;padding:2px 6px;border-radius:6px;border:1px solid currentColor;opacity:.6}
.foot{margin:auto 0 0;font-size:12px;line-height:1.5;color:var(--ink-2)}
.stage{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.fit{position:relative;flex:none}
.device{position:absolute;left:0;top:0;transform-origin:0 0}
.screen{position:relative;overflow:hidden;background:#FFFFFF}
.screen iframe{display:block;width:100%;height:100%;border:0;background:#FFFFFF}
.device.phone{padding:6px;border-radius:52px;background:var(--bezel);box-shadow:0 0 0 1px var(--bezel-edge),0 30px 70px -30px var(--shadow)}
.device.phone .screen{border-radius:46px}
.device.bare .screen{border-radius:22px;box-shadow:0 0 0 1px var(--line)}
.device.sheet .screen{border-radius:6px;box-shadow:0 0 0 1px var(--line),0 30px 70px -30px var(--shadow)}
.island{display:none}
.device.phone .island{display:none}
.fab,.side .close{display:none}
.mbar{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (max-width: 820px){
  .app{display:block;height:100%;padding:0}
  .mbar,.side{display:none}
  .stage{position:fixed;inset:0;padding:0}
  .device.bare .screen{border-radius:0;box-shadow:none}
  .fab{display:flex;position:fixed;z-index:40;top:max(7px, env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);align-items:center;gap:6px;
    height:28px;padding:0 12px;border:0;border-radius:14px;background:rgba(10,20,35,.62);color:#FFFFFF;font:600 12px/28px var(--f-body);cursor:pointer;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
  body.menu-open .side{display:flex;position:fixed;inset:0;z-index:50;border:0;border-radius:0;padding-top:max(22px, env(safe-area-inset-top, 0px))}
  body.menu-open .side .close{display:flex;position:absolute;top:max(14px, env(safe-area-inset-top, 0px));right:14px;width:40px;height:40px;border:0;border-radius:50%;
    background:var(--blue-soft);color:var(--ink);font-size:24px;line-height:1;align-items:center;justify-content:center;cursor:pointer}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

    (it.kz ? '' : '<span class="chip" title="Есть только на русском">RU</span>') + '</a></li>').join('') +
    '</ul></section>').join('');
  pick.innerHTML = DATA.map(sec => '<optgroup label="' + sec.title + '">' +
    sec.items.map(it => '<option value="' + it.id + '">' + it.label + '</option>').join('') + '</optgroup>').join('');

  function load(file) {
    curFile = file;
    frame.src = srcOf(file);
  }
  function go(it) {
    const h = hashOf(it);
    if (location.hash === h) { load(fileOf(it, lang)); return; }   // тот же экран: начать заново
    location.hash = h;
  }
  function route() {
    const m = /^#(ru|kz)-([a-z0-9-]+)$/.exec(location.hash);
    const it = m && flat.find(x => x.id === m[2]);
    if (it) { cur = it; lang = m[1]; } else { cur = flat[0]; }
    const f = fileOf(cur, lang);
    if (f !== curFile) load(f);
    render(); layout();
  }
  function fromFrame(f) {
    const hit = byFile[f];
    if (!hit) return;
    const [it, lg] = hit;
    if (it.kz) lang = lg;
    cur = it; curFile = f;
    const h = hashOf(it);
    if (location.hash !== h) location.replace(h);
    render(); layout();
  }
  // экран сам сообщает, что открылся (работает и при открытии файла с диска)
  addEventListener('message', e => {
    if (e.source !== frame.contentWindow) return;
    const d = e.data;
    if (!d || d.type !== '__dc_booted') return;
    fromFrame(String(d.rootName || '').split('/').pop().replace(/\.dc\.html?$/i, ''));
  });
  frame.addEventListener('load', () => {
    try {
      const p = decodeURIComponent(frame.contentWindow.location.pathname.split('/').pop());
      fromFrame(p.replace(/\.dc\.html?$/i, ''));
    } catch (_) { /* с диска браузер не даёт читать адрес — хватает сообщения экрана */ }
  });

  function render() {
    toc.querySelectorAll('a').forEach(a => {
      a.href = '#' + lang + '-' + a.dataset.id;
      if (a.dataset.id === cur.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    $('#now-sec').textContent = cur.sec;
    $('#now-pos').textContent = (cur.n + 1) + ' из ' + flat.length;
    $('#now-title').textContent = cur.label;
    $('#now-hint').textContent = cur.hint;
    $('#now-warn').hidden = !(lang === 'kz' && !cur.kz);
    $('#solo').href = srcOf(curFile || fileOf(cur, lang));
    pick.value = cur.id;
    document.title = 'Прототип iLab';
  }

  const mobile = matchMedia('(max-width: 820px)');
  function layout() {
    const cs = getComputedStyle(stage);
    const aw = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    if (aw <= 0 || ah <= 0) return;
    const phone = cur.w === 390;
    const bare = phone && mobile.matches && aw / 390 <= 1.15;
    let W = cur.w, H = cur.h, ow, oh, s;
    if (bare) {
      s = aw / 390; W = 390; H = Math.round(ah / s); ow = W; oh = H;
    } else if (phone) {
      W = 390; H = 844; ow = W + 12; oh = H + 12;
      s = Math.min(1, aw / ow, ah / oh);
    } else {
      ow = W; oh = H; s = Math.min(1, aw / W, ah / H);
    }
    device.className = 'device ' + (bare ? 'bare' : phone ? 'phone' : 'sheet');
    screen.style.width = W + 'px';
    screen.style.height = H + 'px';
    device.style.transform = 'scale(' + s + ')';
    fit.style.width = (ow * s) + 'px';
    fit.style.height = (oh * s) + 'px';
  }

  const menu = (on) => document.body.classList.toggle('menu-open', on);
  $('#fab').addEventListener('click', () => menu(true));
  $('#closeMenu').addEventListener('click', () => menu(false));
  toc.addEventListener('click', e => {
    const a = e.target.closest('a[data-id]');
    if (!a) return;
    e.preventDefault();
    menu(false);
    go(flat.find(x => x.id === a.dataset.id));
  });
  pick.addEventListener('change', () => go(flat.find(x => x.id === pick.value)));
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    go(cur);
  }));
  const step = d => go(flat[(cur.n + d + flat.length) % flat.length]);
  $('#prev').addEventListener('click', () => { menu(false); step(-1); });
  $('#next').addEventListener('click', () => { menu(false); step(1); });
  addEventListener('keydown', e => {
    if (e.altKey || e.metaKey || e.ctrlKey || /^(SELECT|INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
    if (e.key === 'ArrowRight') { step(1); e.preventDefault(); }
    if (e.key === 'ArrowLeft') { step(-1); e.preventDefault(); }
  });
  addEventListener('hashchange', route);
  addEventListener('resize', layout);
  mobile.addEventListener('change', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
  route();
})();
</script>
</body>
</html>
